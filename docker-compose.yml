services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DOCKER_DB_NAME:-surfing}
      POSTGRES_USER: ${DOCKER_DB_USER:-surfing}
      POSTGRES_PASSWORD: ${DOCKER_DB_PASSWORD:-surfing}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOCKER_DB_USER:-surfing} -d ${DOCKER_DB_NAME:-surfing}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  web:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: ${DOCKER_DJANGO_SETTINGS_MODULE:-surfingproject.settings}
      SECRET_KEY: ${DOCKER_SECRET_KEY:-}
      DEBUG: ${DOCKER_DEBUG:-False}
      ALLOWED_HOSTS: ${DOCKER_ALLOWED_HOSTS:-127.0.0.1,localhost}
      CSRF_TRUSTED_ORIGINS: ${DOCKER_CSRF_TRUSTED_ORIGINS:-}
      SERVE_MEDIA_LOCALLY: ${DOCKER_SERVE_MEDIA_LOCALLY:-True}
      DB_ENGINE: postgresql
      DB_NAME: ${DOCKER_DB_NAME:-surfing}
      DB_USER: ${DOCKER_DB_USER:-surfing}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-surfing}
      DB_HOST: db
      DB_PORT: 5432
      CHANNEL_LAYER_REDIS_URL: ${DOCKER_CHANNEL_LAYER_REDIS_URL:-redis://redis:6379/0}
      SQLITE_NAME: db.sqlite3
      RUN_COLLECTSTATIC: ${DOCKER_RUN_COLLECTSTATIC:-1}
      RUN_DEMO_SEED: ${DOCKER_RUN_DEMO_SEED:-0}
    ports:
      - "127.0.0.1:8000:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - media_data:/app/media

volumes:
  postgres_data:
  media_data:
  redis_data:
