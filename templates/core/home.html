{% extends "base.html" %}

{% block extra_css %}
    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    />

    <!-- MarkerCluster CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
    />
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
    />

    <style>
        #home-map {
            height: 500px;
            width: 100%;
            border-radius: 8px;
            margin-top: 1rem;
        }
    </style>
{% endblock %}

{% block content %}
    <h2>Surf spots map</h2>
    <p class="text-muted">
        All surf spots currently in the database are shown on the map.
    </p>

    <div id="home-map"></div>
{% endblock %}

{% block extra_js %}
    <!-- Leaflet JS -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
    ></script>

    <!-- MarkerCluster JS -->
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Start position – Europa/środkowy Bałtyk
            const map = L.map("home-map").setView([54.5, 18.5], 4);

            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors',
            }).addTo(map);

            const markers = L.markerClusterGroup();
            const bounds = [];

            fetch("{% url 'spots:spot_map_data' %}")
                .then(response => response.json())
                .then(data => {
                    if (!Array.isArray(data) || data.length === 0) {
                        return;
                    }

                    data.forEach(spot => {
                        if (spot.lat == null || spot.lng == null) {
                            return;
                        }

                        const marker = L.marker([spot.lat, spot.lng]);

                        const popupHtml = `
                            <strong>${spot.name}</strong><br>
                            ${spot.country} • ${spot.difficulty}<br>
                            <a href="/spots/${spot.slug}/">View details</a>
                        `;

                        marker.bindPopup(popupHtml);
                        markers.addLayer(marker);

                        bounds.push([spot.lat, spot.lng]);
                    });

                    map.addLayer(markers);

                    if (bounds.length > 0) {
                        map.fitBounds(bounds, { padding: [30, 30] });
                    }
                })
                .catch(err => {
                    console.error("Failed to load spot map data:", err);
                });
        });
    </script>
{% endblock %}
