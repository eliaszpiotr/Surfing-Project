{% extends "base.html" %}

{% block content %}
    <h2>Delete spot</h2>

    <p>
        Are you sure you want to delete surf spot
        <strong>"{{ object.name }}"</strong>?
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">
            Yes, delete
        </button>
        <a href="{% url 'spots:spot_detail' object.slug %}" class="btn btn-secondary">
            Cancel
        </a>
    </form>
{% endblock %}
